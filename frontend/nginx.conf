# SoloPrac frontend + API proxy.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The standard MIME map first, then the one addition this app needs.
    # A bare `types { ... }` block *replaces* the map instead of extending
    # it, which silently turns .js and .svg into application/octet-stream
    # - and a service worker served with the wrong content type is rejected
    # outright by the browser. This exact mistake is why the include is here.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json  webmanifest;

        # pdf.js ships its worker as a `.mjs` module script. nginx's stock
        # MIME map has no entry for `.mjs`, so it falls through to
        # `default_type application/octet-stream` and the browser refuses to
        # execute it under strict MIME checking. The symptom is a viewer that
        # opens, shows its full chrome, correctly reports "PDF" and the file
        # size -- and renders zero pages, with only a console error to
        # explain it.
        application/javascript    mjs;
    }
    default_type application/octet-stream;

    # Hashed build assets are immutable by construction, so they can be
    # cached hard. index.html must not be, or a deploy never reaches a
    # returning visitor.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        # The service worker must always be revalidated, or a stale one
        # keeps serving an old shell after a deploy.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # Streaming chat responses must not be buffered, or tokens arrive
        # in one lump at the end.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
