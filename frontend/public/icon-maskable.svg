<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d39a"/>
      <stop offset="1" stop-color="#4d8dff"/>
    </linearGradient>
  </defs>
  <!-- Maskable: the art is inset to the 80% safe zone so a circular
       platform mask cannot clip the bars. -->
