  <rect x="18" y="20" width="28" height="5" rx="2.5" fill="url(#g)"/>
  <rect x="18" y="30" width="28" height="5" rx="2.5" fill="#f5a524"/>
  <line x1="16" y1="32.5" x2="48" y2="32.5" stroke="#f5a524" stroke-width="2" stroke-linecap="round"/>
  <rect x="18" y="40" width="18" height="5" rx="2.5" fill="#1e2a44"/>
</svg>
